[project]
name = "erag"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115", 
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "opentelemetry-instrumentation-asyncpg>=0.51b0",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erag"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
