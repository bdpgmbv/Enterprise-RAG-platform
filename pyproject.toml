[project]
name = "erag"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115", 
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "structlog>=25.1"
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erag"]
