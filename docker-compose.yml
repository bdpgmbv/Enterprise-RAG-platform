# Local observability stack.
name: erag-learn

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4337:4317"
    volumes:
      - "./docker/otel/config.yaml:/etc/otel/config.yaml:ro"
    depends_on: [tempo]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.0
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "3220:3200"
    volumes:
      - "./docker/tempo/config.yaml:/etc/tempo/config.yaml:ro"
      - "tempo-data:/var/tempo"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3020:3000"
    volumes:
      - "./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"
    depends_on: [tempo]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erag_owner
      POSTGRES_PASSWORD: erag_owner_pw
      POSTGRES_DB: erag_db
    ports:
      - "5472:5432"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erag_owner -d erag_db"]
      interval: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    cap_add: ["IPC_LOCK"]
    ports:
      - "8200:8200"
    volumes:
      - "./docker/vault:/vault/config:ro"
      - "./docker/certs/erag-local-vault-server.crt:/vault/certs/erag-local-vault-server.crt:ro"
      - "./docker/certs/erag-local-vault-server.key:/vault/certs/erag-local-vault-server.key:ro"
      - "vault-data:/vault/file"

volumes:
  tempo-data:
  postgres-data:
  vault-data: